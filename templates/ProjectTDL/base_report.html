<!-- ProjectTDL/templates/ProjectTDL/base_report.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Отчет по задачам{% endblock %}</title>
    <style>
        /* Основные стили */
        body { font-family: Arial, sans-serif; margin: 40px; }
        .header { background-color: #2c3e50; color: white; padding: 20px; border-radius: 5px; }
        .summary-section { margin: 30px 0; background-color: #f8f9fa; padding: 20px; border-radius: 5px; border: 1px solid #ddd; }
        .task-block { border: 1px solid #ddd; margin: 20px 0; padding: 20px; border-radius: 5px; }
        .task-header { background-color: #f8f9fa; padding: 15px; border-left: 4px solid #3498db; position: relative; }
        .section { margin: 15px 0; }
        .section-title { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th { background-color: #f2f2f2; text-align: left; padding: 12px 8px; }
        td { padding: 10px 8px; border-bottom: 1px solid #ddd; }
        .total { font-weight: bold; background-color: #e8f4fc; padding: 15px; border-radius: 3px; margin: 20px 0; }
        .no-data { color: #999; font-style: italic; }
        .status-active { color: #27ae60; }
        .status-completed { color: #3498db; }
        .status-overdue { color: #e74c3c; }
        .summary-table tr:hover { background-color: #f5f5f5; cursor: pointer; }
        .nav-button { background-color: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; margin: 5px; }
        .nav-button:hover { background-color: #2980b9; }
        .task-nav { position: absolute; top: 15px; right: 15px; }
        .expand-button { background-color: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 2px; }
        .collapse-button { background-color: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 2px; }
        .task-details { display: none; margin-top: 15px; }
        .task-details.expanded { display: block; }
        .summary-stats { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .stat-box { background-color: white; border: 1px solid #ddd; border-radius: 5px; padding: 15px; flex: 1; margin: 0 10px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; color: #2c3e50; }
        .stat-label { color: #7f8c8d; font-size: 14px; }
        .jump-to-task { margin-left: 10px; font-size: 12px; color: #3498db; cursor: pointer; text-decoration: underline; }
        /* Master-detail: раскрывающаяся строка под строкой задачи */
        .inline-row > td {
            background: #f7fafc;
            border-left: 4px solid #3498db;
            padding: 20px 25px;
        }
        .inline-details {
            border: none;
            margin: 0;
            padding: 0;
            background: transparent;
        }
        .inline-details .task-header {
            display: none;
        }
        .inline-details .task-details {
            display: block;
        }
        #summary-table tbody tr.opened {
            background-color: #e8f4fc;
        }
        .details-toggle {
            min-width: 110px;
        }
        /* Цветовая индикация сроков */
        .deadline-overdue { color: #e74c3c; font-weight: bold; }
        .deadline-today { color: #e67e22; font-weight: bold; }
        .deadline-soon { color: #f39c12; font-weight: bold; }
        .deadline-normal { color: #27ae60; }
        .deadline-empty { color: #7f8c8d; }
        /* Длинная история сроков — скролл внутри блока */
        .history-list {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background: white;
        }
        /* Этапы 3–4: тулбар поиска/фильтров, чипы, сортировка, пейджер */
        .report-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .toolbar-search {
            flex: 2 1 260px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
        }
        .toolbar-select {
            flex: 1 1 150px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            background: white;
        }
        .toolbar-reset {
            padding: 8px 15px;
            background-color: #95a5a6;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .toolbar-reset:hover { background-color: #7f8c8d; }
        .quick-filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }
        .chip {
            padding: 5px 14px;
            border: 1px solid #3498db;
            background: white;
            color: #2980b9;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
        }
        .chip:hover { background: #e8f4fc; }
        .chip.active {
            background: #3498db;
            color: white;
        }
        .filter-counter {
            margin-left: auto;
            color: #7f8c8d;
            font-size: 13px;
        }
        #summary-table th[data-sort-key] {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        #summary-table th[data-sort-key]:hover {
            background-color: #e0e0e0;
        }
        #summary-table th.sorted-asc::after { content: ' ▲'; }
        #summary-table th.sorted-desc::after { content: ' ▼'; }
        .report-pager {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
        }
        .pager-info { color: #2c3e50; }
        .nav-button:disabled {
            background-color: #bdc3c7;
            cursor: default;
        }
        @media print {
            .controls-container,
            .report-toolbar,
            .quick-filters,
            .report-pager,
            .nav-button,
            .expand-button,
            .collapse-button,
            .details-toggle,
            .back-to-top {
                display: none !important;
            }
            .inline-row {
                display: table-row !important;
            }
            body {
                margin: 0;
            }
            .task-details {
                display: block !important;
            }
        }
        .back-to-top { position: fixed; bottom: 20px; right: 20px; background-color: #3498db; color: white; padding: 10px; border-radius: 50%; text-decoration: none; display: none; }
        .controls-container { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
        .control-button { padding: 10px 15px; color: white; border: none; border-radius: 3px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .admin-link-btn { background-color: #34495e; text-decoration: none; padding: 10px 15px; color: white; border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; }
        .home-link-btn { background-color: #16a085; text-decoration: none; padding: 10px 15px; color: white; border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <a href="#" class="back-to-top" id="back-to-top" onclick="scrollToTop(); return false;">↑</a>

    <script>
        {% block javascript %}{% endblock %}

        // Общие функции
        function scrollToTop() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }

        // Показываем кнопку "Наверх" при прокрутке
        window.addEventListener('scroll', function() {
            const backToTopBtn = document.getElementById('back-to-top');
            if (window.pageYOffset > 300) {
                backToTopBtn.style.display = 'block';
            } else {
                backToTopBtn.style.display = 'none';
            }
        });
    </script>
</body>
</html>
