{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex align-items-center gap-3 mb-3">
    <h3 class="mb-0">Дерево задач</h3>
    <a href="{% url 'custom_task_view' %}" class="btn btn-sm btn-outline-secondary ms-auto">
      <i class="bi bi-table me-1"></i>Плоский список
    </a>
  </div>
  <div class="card">
    <div class="card-body p-0">
      <ul class="list-unstyled mb-0" style="font-size:14px;">
        {% for root in roots %}
          {% include 'ProjectTDL/task_tree_node.html' with node=root depth=0 %}
        {% empty %}
          <li class="p-3 text-muted">Нет задач</li>
        {% endfor %}
      </ul>
    </div>
  </div>
</div>
{% endblock %}
