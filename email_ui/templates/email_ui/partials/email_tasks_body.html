{% for task in email.tasks.all %}
<span class="badge bg-info mb-1 me-1">{{ task.name }}
  <a href="#" hx-post="{% url 'email_ui:detach_task' email.pk task.pk %}" hx-target="closest span" hx-swap="outerHTML" class="text-white ms-1">&times;</a>
</span>
{% empty %}<span class="text-muted">Нет привязанных задач</span>
{% endfor %}
<a href="{% url 'email_ui:attach_tasks_page' email.pk %}" class="btn btn-outline-primary btn-sm ms-2">
        <i class="bi bi-plus-lg"></i> Прикрепить задачу</a>
