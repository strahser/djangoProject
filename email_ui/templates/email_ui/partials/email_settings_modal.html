<div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title"><i class="bi bi-gear me-1"></i>Настройки почты</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'email_ui:save_email_settings' %}"
              hx-target="#emailModalContent" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <h6 class="fw-semibold mb-2">Тема письма</h6>
                <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" id="email-show-preview"
                           name="show_body_preview" value="on"
                           {% if view_settings.show_body_preview %}checked{% endif %}>
                    <label class="form-check-label" for="email-show-preview">
                        Показывать начало текста письма под темой
                    </label>
                </div>
                <label class="form-label small text-muted" for="email-preview-length">
                    Символов содержания ({{ min_len }}–{{ max_len }})
                </label>
                <input type="number" class="form-control form-control-sm" id="email-preview-length"
                       name="preview_length" value="{{ view_settings.preview_length }}"
                       min="{{ min_len }}" max="{{ max_len }}" step="10" style="max-width:140px;">
            </div>
            <div class="modal-footer">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
            </div>
        </form>
    </div>
</div>
