<div class="nav-section">
    <div style="padding: 4px 12px 12px;">
        <button class="btn btn-primary w-100" onclick="EmailApp.openModal('{% url 'email_ui:compose_modal' %}'); return false;">
            <i class="bi bi-pencil-square me-1"></i> Написать
        </button>
    </div>
</div>

<div class="nav-section">
    <a class="nav-item{% if folder == 'inbox' %} active{% endif %}" href="#"
       hx-get="{% url 'email_ui:email_list_partial' %}?folder=inbox"
       hx-target="#email-list-container"
       hx-push-url="{% url 'email_ui:inbox' 'inbox' %}"
       onclick="if(window.EmailFilterNav) EmailFilterNav.resetForFolder();">
        <i class="bi bi-inbox"></i> Входящие
        <span class="badge" id="count-inbox" data-count="0">0</span>
    </a>
    <a class="nav-item{% if folder == 'sent' %} active{% endif %}" href="#"
       hx-get="{% url 'email_ui:email_list_partial' %}?folder=sent"
       hx-target="#email-list-container"
       hx-push-url="{% url 'email_ui:inbox' 'sent' %}"
       onclick="if(window.EmailFilterNav) EmailFilterNav.resetForFolder();">
        <i class="bi bi-send"></i> Отправленные
        <span class="badge" id="count-sent" data-count="0">0</span>
    </a>
    <a class="nav-item{% if folder == 'drafts' %} active{% endif %}" href="#"
       hx-get="{% url 'email_ui:email_list_partial' %}?folder=drafts"
       hx-target="#email-list-container"
       hx-push-url="{% url 'email_ui:inbox' 'drafts' %}"
       onclick="if(window.EmailFilterNav) EmailFilterNav.resetForFolder();">
        <i class="bi bi-file-earmark-text"></i> Черновики
        <span class="badge" id="count-drafts" data-count="0" style="display:none;">0</span>
    </a>
    <a class="nav-item{% if folder == 'archive' %} active{% endif %}" href="#"
       hx-get="{% url 'email_ui:email_list_partial' %}?folder=archive"
       hx-target="#email-list-container"
       hx-push-url="{% url 'email_ui:inbox' 'archive' %}"
       onclick="if(window.EmailFilterNav) EmailFilterNav.resetForFolder();">
        <i class="bi bi-archive"></i> Архив
    </a>
    <a class="nav-item{% if folder == 'trash' %} active{% endif %}" href="#"
       hx-get="{% url 'email_ui:email_list_partial' %}?folder=trash"
       hx-target="#email-list-container"
       hx-push-url="{% url 'email_ui:inbox' 'trash' %}"
       onclick="if(window.EmailFilterNav) EmailFilterNav.resetForFolder();">
        <i class="bi bi-trash3"></i> Корзина
    </a>
</div>

<div class="nav-section">
    <div class="nav-section-title">Фильтры</div>
    <a class="nav-item" href="#" data-quick-filter="is_important"
       onclick="return window.EmailFilterNav ? EmailFilterNav.applyQuickFilter('is_important') : false;">
        <i class="bi bi-star"></i> Важные
        <span class="badge" id="count-important" data-count="0">0</span>
    </a>
    <a class="nav-item" href="#" data-quick-filter="has_attachments"
       onclick="return window.EmailFilterNav ? EmailFilterNav.applyQuickFilter('has_attachments') : false;">
        <i class="bi bi-paperclip"></i> С вложениями
        <span class="badge" id="count-attachments" data-count="0">0</span>
    </a>
    <a class="nav-item" href="#" data-quick-filter="is_unread"
       onclick="return window.EmailFilterNav ? EmailFilterNav.applyQuickFilter('is_unread') : false;">
        <i class="bi bi-envelope"></i> Непрочитанные
        <span class="badge" id="count-unread" data-count="0">0</span>
    </a>
</div>

{% if pinned_filters %}
<div class="nav-section">
    <div class="nav-section-title">Сохранённые</div>
    {% for sf in pinned_filters %}
    <a class="nav-item" href="{% url 'email_ui:apply_saved_filter' sf.pk %}" title="Применить фильтр">
        <i class="bi bi-bookmark-star-fill"></i> {{ sf.name|truncatechars:22 }}
    </a>
    {% endfor %}
</div>
{% endif %}

<div class="nav-section">
    <div class="nav-section-title">Справочники</div>
    <a class="nav-item" href="{% url 'email_ui:contact_list' %}">
        <i class="bi bi-person-lines-fill"></i> Контакты
    </a>
    <a class="nav-item" href="{% url 'email_ui:group_list' %}">
        <i class="bi bi-people"></i> Группы адресатов
    </a>
</div>
