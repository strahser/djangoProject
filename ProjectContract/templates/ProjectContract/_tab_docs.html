<div class="p-3 mb-3" style="background:var(--bg-card,#fff);border:1px solid var(--border,#e2e6ee);border-radius:12px;">
  <form method="post" action="{% url 'contract_attachment_add' contract.pk %}" enctype="multipart/form-data" class="row g-2 align-items-end">
    {% csrf_token %}
    <div class="col-md-5"><label class="form-label small text-muted mb-0">Файл</label><input type="file" name="file" class="form-control form-control-sm" required></div>
    <div class="col-md-4"><label class="form-label small text-muted mb-0">Описание</label><input type="text" name="description" class="form-control form-control-sm" maxlength="255" placeholder="Краткое описание"></div>
    <div class="col-md-3"><button class="btn btn-sm btn-primary w-100" type="submit"><i class="bi bi-upload me-1"></i>Загрузить</button></div>
  </form>
</div>
<div class="table-responsive">
  <table class="table cf-table">
    <thead>
      <tr>
        <th>Файл</th>
        <th>Описание</th>
        <th>Загрузил</th>
        <th>Дата</th>
      </tr>
    </thead>
    <tbody>
      {% for a in attachments %}
      <tr>
        <td><a href="{{ a.file.url }}" target="_blank" class="text-decoration-none">{{ a.file.name|truncatechars:60 }}</a></td>
        <td>{{ a.description|default:"—" }}</td>
        <td>{{ a.uploaded_by.username|default:"—" }}</td>
        <td class="num">{{ a.creation_stamp|date:"d.m.Y H:i" }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted py-4">Файлов пока нет</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
